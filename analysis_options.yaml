# Dart analysis options for switchon_diet
# Lints that matter are promoted to errors (see docs/CODING_GUIDELINES.md).

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "ios/**"
    - "android/**"

  errors:
    # Treat these as errors
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    unnecessary_brace_in_string_interps: error
    # const 최적화 관련 (성능 향상)
    prefer_const_constructors: error
    prefer_const_constructors_in_immutables: error
    prefer_const_declarations: error
    prefer_const_literals_to_create_immutables: error
    # 불필요한 코드 (코드 품질)
    unnecessary_null_checks: error

linter:
  rules:
    # 필수 규칙 - 타입 및 선언
    - always_declare_return_types
    - annotate_overrides
    - prefer_final_fields
    # TODO: 점진적으로 적용
    # - prefer_final_locals
    # - prefer_typing_uninitialized_variables

    # const 최적화 (성능)
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # 코드 품질
    - avoid_empty_else
    - avoid_print
    - avoid_unnecessary_containers
    # TODO: 점진적으로 적용
    # - avoid_redundant_argument_values
    - avoid_returning_null_for_void
    - no_duplicate_case_values
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_checks

    # 스타일
    - prefer_single_quotes
    - sized_box_for_whitespace
    - sort_child_properties_last
    - use_key_in_widget_constructors

    # 비동기 및 컨텍스트
    - use_build_context_synchronously
    # TODO: 추후 상대 경로 import를 package import로 변경
    # - always_use_package_imports
