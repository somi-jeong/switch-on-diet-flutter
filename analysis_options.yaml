include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "ios/**"
    - "android/**"
  errors:
    # Promoted to errors so they fail `flutter analyze` (see docs/CODING_GUIDELINES.md).
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    unnecessary_null_checks: error
    prefer_const_constructors: error
    prefer_const_constructors_in_immutables: error
    prefer_const_declarations: error
    prefer_const_literals_to_create_immutables: error

linter:
  rules:
    # Types and declarations
    - always_declare_return_types
    - annotate_overrides
    - prefer_final_fields
    - prefer_final_locals
    - prefer_final_in_for_each
    - type_annotate_public_apis

    # Imports
    - always_use_package_imports
    - directives_ordering

    # const
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - unnecessary_const

    # Correctness
    - avoid_print
    - avoid_returning_null_for_void
    - avoid_void_async
    - cancel_subscriptions
    - no_duplicate_case_values
    - unawaited_futures
    - use_build_context_synchronously

    # Style
    - avoid_redundant_argument_values
    - avoid_unnecessary_containers
    - prefer_single_quotes
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unnecessary_brace_in_string_interps
    - unnecessary_lambdas
    - unnecessary_new
    - unnecessary_null_checks
    - unnecessary_parenthesis
    - use_key_in_widget_constructors
    - use_super_parameters
